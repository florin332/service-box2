; ============================================================
; GLOBAL ENVIRONMENT SETTINGS
; ============================================================
[env]
framework = arduino
monitor_speed = 115200

; Core Earle Philhower (arduino-pico) pinned la ultima varianta stabila: 6.3.0
; (platforma maxgerhardt pin-uiaza default un commit de pe master, ~6.0.0)
platform_packages =
    framework-arduinopico@https://github.com/earlephilhower/arduino-pico.git#6.3.0

build_flags =
    -Wall
    -Wextra
    -std=gnu++17

lib_deps =
    adafruit/Adafruit GFX Library@^1.12.6 ;@ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0 ;@ ^1.10.3
    adafruit/Adafruit ILI9341@^1.6.3
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    circuitstate/CSE_CST328@^0.0.5
    ; SD card: FatFS + drivere SDIO (PIO) / SPI pentru RP2040/RP2350
    ; Waveshare: SDIO 4-bit GP19-GP24 | Marble: SPI0 bit-bang GP16-19 + CS GP17
    https://github.com/carlk3/no-OS-FatFS-SD-SDIO-SPI-RPi-Pico.git


; ============================================================
; VARIANT A: GROUNDSTUDIO MARBLE PICO (RP2040)
; ============================================================
[env:marble_pico]
; maxgerhardt community platform - contine definitia board-ului
; groundstudio_marble_pico (aceeasi platforma ca tester-touch-lcd,
; validata pe hardware, si ca env:waveshare_rp2350 de mai jos)
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = groundstudio_marble_pico
board_build.core = earlephilhower
board_build.f_cpu = 133000000L
board_build.usb_mode = pico_sdk
build_flags = 
    ${env.build_flags} 
    -D SERVICEBOX_MARBLE

; ============================================================
; VARIANT B: WAVESHARE RP2350 TOUCH LCD 2.8
; ============================================================
[env:waveshare_rp2350]
; Uses maxgerhardt community platform to access native RP2350 architecture
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
; Fixed: Forces the compilation to use the official Pico 2 layout manifest with BS2 bootloader
board = rpipico2
board_build.core = earlephilhower
; 144 MHz: multiplu de 12 MHz, cerinta dura pentru Pico-PIO-USB (USB host
; bit-bang pe GP0/GP1). Default-ul rpipico2 (150 MHz) NU este multiplu de 12.
board_build.f_cpu = 144000000L
; Disables library archiving to prevent linker blocks inside GCC 12/14 pipelines
lib_archive = false
; USB dual-role (Adafruit TinyUSB):
;   rhport0 = device pe controllerul nativ (Serial CDC + UF2, nemodificat)
;   rhport1 = host pe PIO, GP0=D+ / GP1=D- (catre portul USB al DUT-ului)
; USE_TINYUSB selecteaza stack-ul Adafruit TinyUSB.
; CFG_TUSB_MCU: tusb_config_rp2040.h defaulteaza la OPT_MCU_RP2040, RP2350
; trebuie declarat explicit.
build_flags = 
    ${env.build_flags} 
    -D SERVICEBOX_WAVESHARE
    -D USE_TINYUSB
    -D CFG_TUSB_MCU=OPT_MCU_RP2350
; deep+: pio_usb.h trebuie vizibil la compilarea bibliotecii TinyUSB, altfel
; __has_include("pio_usb.h") nu activeaza CFG_TUH_RPI_PIO_USB
lib_ldf_mode = deep+
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit TinyUSB Library@^3.7.7
    ; Pico-PIO-USB: copie LOCALA in lib/Pico PIO USB (cu patch critic:
    ; cursa de clear a flag-ului TX din pio_usb_bus_usb_transfer + timeout-uri
    ; in buclele busy-wait - fara patch, core1 se bloca aleator in idle).
    ; NU readauga linia git aici: s-ar compila de doua ori.
upload_protocol = picotool
; Fara upload_flags custom: "-fcaut" era parsat ca optiuni grupate si
; picotool 2.0.0 esua cu "unexpected option: -c". Default-ul platformei
; (load + execute) este suficient.




